<div class="form-success-card">
    <div class="success-icon">✓</div>
    <h3 class="success-title">Message Sent Successfully</h3>
    <p class="success-text">
        Thank you, <strong>{{ name }}</strong>. Your message regarding <em>"{{ subject }}"</em> has been received. I will get back to you shortly.
    </p>
    <div class="mt-4">
        <a href="/contact" hx-get="/contact" hx-target="#main-content" class="btn btn-secondary btn-sm">
            Send Another Message
        </a>
    </div>
</div>
