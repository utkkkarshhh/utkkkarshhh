<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ profile.name }} | {{ profile.headline }}</title>
    <meta name="description" content="{{ profile.name }} - {{ profile.headline }}. Experience at NIQ, AgBe Technologies, Timeli. MCA & BCA Graduate.">
    <link rel="icon" type="image/jpeg" href="/favicon.ico">
    
    <!-- Clean Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- HTMX 2.0.4 -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    <!-- Modern Deep-Tech Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Floating Island Dock Header -->
    <header class="site-header">
        <div class="header-dock">
            <div class="header-dock-top">
                <a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true" class="brand">
                    <span class="brand-symbol">U</span>
                    <div class="brand-text-group">
                        <span class="brand-name">{{ profile.name }}</span>
                        <span class="brand-role">{{ profile.current_role.split('@')[0].strip() }} @ NIQ</span>
                    </div>
                </a>

                <div class="header-actions">
                    <button id="theme-toggle-btn" class="theme-toggle" title="Toggle Dark/Light Mode [T]" onclick="toggleTheme()">
                        <span id="theme-icon">◐</span>
                    </button>
                    <a href="{{ profile.resume_url }}" target="_blank" rel="noopener noreferrer" class="btn-resume">
                        Resume ↗
                    </a>
                </div>
            </div>

            <!-- Navigation Links with Keyboard Shortcuts -->
            <nav class="nav-links" id="nav-container">
                <a href="/" 
                   hx-get="/" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'about' %}active{% endif %}">
                    <span>About</span>
                    <span class="nav-kbd">1</span>
                </a>
                <a href="/experience" 
                   hx-get="/experience" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'experience' %}active{% endif %}">
                    <span>Experience</span>
                    <span class="nav-kbd">2</span>
                </a>
                <a href="/projects" 
                   hx-get="/projects" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'projects' %}active{% endif %}">
                    <span>Projects</span>
                    <span class="nav-kbd">3</span>
                </a>
                <a href="/education" 
                   hx-get="/education" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'education' %}active{% endif %}">
                    <span>Education</span>
                    <span class="nav-kbd">4</span>
                </a>
                <a href="/skills" 
                   hx-get="/skills" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'skills' %}active{% endif %}">
                    <span>Skills</span>
                    <span class="nav-kbd">5</span>
                </a>
                <a href="/contact" 
                   hx-get="/contact" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="nav-item {% if active_tab == 'contact' %}active{% endif %}">
                    <span>Contact</span>
                    <span class="nav-kbd">6</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Swapped via HTMX or SSR -->
    <main id="main-content" class="container content-area">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal Container for Project Details & Reports -->
    <div id="modal-container"></div>

    <!-- Minimal Modern Footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-left">
                <span>© {{ profile.name }}</span>
                <span class="dot">·</span>
                <span>{{ profile.location }}</span>
                <span class="dot">·</span>
                <div class="keyboard-bar">
                    <span class="kbd">1-6</span> nav <span class="kbd">T</span> theme <span class="kbd">Esc</span> close
                </div>
            </div>
            <div class="footer-links">
                <a href="mailto:{{ profile.email }}">Email</a>
                <span class="dot">·</span>
                <a href="{{ profile.github }}" target="_blank" rel="noopener">GitHub</a>
                <span class="dot">·</span>
                <a href="{{ profile.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
            </div>
        </div>
    </footer>

    <!-- Client Script -->
    <script src="/static/js/main.js"></script>
</body>
</html>
